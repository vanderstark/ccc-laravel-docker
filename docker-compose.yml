version: "3.8"

services:
  app:
    build: .
    container_name: ccc-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ccc_database
      - DB_USERNAME=ccc_user
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ccc-net

  nginx:
    image: nginx:alpine
    container_name: ccc-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ccc-net

  db:
    image: mysql:8.0
    container_name: ccc-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ccc_database
      MYSQL_USER: ccc_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ccc-net

volumes:
  dbdata:
  storage:

networks:
  ccc-net:
    driver: bridge